
name: Java CI - Proyecto L8

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21 y Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn --batch-mode clean verify

      - name: Guardar archivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: aplicacion-java
          path: target/*.jar
